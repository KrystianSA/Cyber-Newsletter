[project]
name = "cyber-newsletter-backend"
version = "0.1.0"
description = "Backend API for Cyber Newsletter signup"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic[email]>=2.9.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3.0",
    "ruff==0.17.1",
]
