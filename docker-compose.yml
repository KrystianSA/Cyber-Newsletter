services:

  dev-db:
    extends:
      file: templates.yml
      service: postgres-base
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - db_data:/var/lib/postgresql

  test-db:
    extends:
      file: templates.yml
      service: postgres-base
    profiles: [ test ]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: cyber_newsletter_test
    ports:
      - 127.0.0.1:5433:5432
    tmpfs:
      - /var/lib/postgresql

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@dev-db:5432/${POSTGRES_DB}
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      dev-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - 127.0.0.1:5173:8080
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
