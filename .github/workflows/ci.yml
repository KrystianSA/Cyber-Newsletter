name: CI

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-linting:
    name: Lint frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-frontend

      - run: npm run lint

  build-frontend:
    name: Build frontend
    needs: frontend-linting
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-frontend

      - run: npm run build

  backend-integration-test:
    name: Backend integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cyber_newsletter_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d cyber_newsletter_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5433/cyber_newsletter_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-backend

      - run: uv run pytest